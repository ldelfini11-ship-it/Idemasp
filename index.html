<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#0d6fb8;--o:#f28a1a;--t:#1f2a37;--bg:#f4f8fb}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Montserrat,system-ui,sans-serif;color:var(--t);background:var(--bg)}
main{max-width:900px;margin:0 auto;padding:16px}img.logo{max-width:min(100%,560px);height:auto;display:block;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0002}
button{background:var(--a);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
button.o{background:var(--o)}button.g{background:#e3eaf0;color:var(--t)}button.s{padding:6px 10px}.big{display:block;width:100%;margin:10px 0}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #b9c7d3;border-radius:8px;font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}label{font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e3eaf0;text-align:left}.tbl{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:#e3eaf0;color:var(--t)}.tabs button.on{background:var(--a);color:#fff}
.warn{background:#fff3e0;border-left:4px solid var(--o);padding:8px 12px;border-radius:6px;font-weight:600;margin:8px 0}.bad{background:#fde8e8;border-color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.dias{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}.ck2{display:flex;align-items:center;background:#eef3f8;border-radius:8px;padding:8px 12px;font-weight:400;cursor:pointer}
.row{display:block;width:100%;text-align:left;background:#fff;color:var(--t);border:1px solid #d5e0ea;margin:6px 0}.row small{display:block;font-weight:400;color:#5b6b7a}.ficha{background:#f4f8fb;border-radius:10px;padding:6px 14px;margin:10px 0}.ficha p{margin:6px 0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}.mbox{background:#fff;border-radius:12px;padding:20px;max-width:420px;width:100%}
#msg{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:9}

const API='https://script.google.com/macros/s/AKfycbyztFL1lS_f6RnRc1FGKF7FhP_XSAD8b2gJef2_qSmTwOVL4e7wjYuDj95j7ursNqR5_A/exec';
const ITENS=['Agilidade','Atenção','Comportamento','Educação','Equilíbrio','Escola Notas','Linguagem','Percepção','Psicomotricidade','Raciocínio'];
let S={v:'home',cfg:{},cred:null,d:null,tab:'notas',novas:[]};
const $=s=>document.querySelector(s),V=s=>$(s).value;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
async function api(action,data={}){try{return await(await fetch(API,{method:'POST',body:JSON.stringify({action,cred:S.cred,...data})})).json()}catch(e){return{erro:'Falha de conexão'}}}
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',4000)}
async function envia(a,d){let r=await api(a,d);if(r.erro&&r.erro.includes('Correção')){const p=prompt('Já lançado. Digite a senha do administrador para corrigir:');if(p)r=await api(a,{...d,adminSenha:p})}
msg(r.erro||r.ok||'Salvo');return r}
const go=(v,t)=>{S.v=v;if(t){S.tab=t;S.ea=null}render()};
const logo=()=>`<img class="logo" src="${esc(S.cfg.logo||LOGO)}" onerror="this.onerror=null;this.src=LOGO" alt="IDEMASP - Pesquisando pelo Futuro">`;
const back=()=>`<button class="g" onclick="S.cred=null;go('home')">Sair</button>`;

function render(){const f={home,resp:()=>login('resp'),colab:()=>login('colab'),boletim,painel}[S.v];$('#app').innerHTML=f()}
function home(){return `${logo()}<p style="text-align:center">${esc(S.cfg.aviso||'')}</p><div class="card"><button class="big o" onclick="go('colab')">Entrar como colaborador</button><button class="big" onclick="go('resp')">Entrar como responsável / aluno</button></div>`}
function login(t){return `${logo()}<div class="card"><h2>${t=='resp'?'Responsável / aluno':'Colaborador'}</h2>`+(t=='resp'?
`<label>Nome do aluno</label><input id="n" autocomplete="off">`:`<label>Login</label><input id="l" autocapitalize="none">`)+
`<label>Senha</label><input id="s" type="password" autocapitalize="none"><button class="big" onclick="entrar('${t}')">Entrar</button><button class="big g" onclick="go('home')">Voltar</button></div>`}
async function entrar(t){
  if(t=='resp'){S.cred={tipo:'resp',nome:V('#n'),senha:V('#s')};const r=await api('boletim');if(r.erro)return msg(r.erro);S.d=r;go('boletim')}
  else{S.cred={tipo:'colab',login:V('#l'),senha:V('#s')};const r=await api('init',{acesso:1});if(r.erro)return msg(r.erro);S.d=r;S.l=null;const ab=abas();if(!ab.length)return msg('Este usuário não tem um nível de acesso válido. Confira a coluna nivel na aba Usuarios.');S.tab=ab[0][0];go('painel')}}

function boletim(){const b=S.d,ms=[...new Set(b.itens.flatMap(i=>Object.keys(i.meses)))].sort();
  return `${logo()}<div class="card"><h2>Boletim de ${esc(b.aluno.nome)}</h2><p>${b.aluno.idade?b.aluno.idade+' anos · ':''}Turma ${esc(b.aluno.turma)} · ${esc(b.aluno.dia)}${b.aluno.tipo?' · '+esc(TIPOS[b.aluno.tipo]||b.aluno.tipo):''}</p>${back()}</div>`+
  b.cursos.map(c=>`<div class="card"><h3>${esc(c.nome)} (${esc(c.sigla)})</h3><p>Presenças: <b>${c.presencas}</b> · Faltas: <b>${c.faltas}</b> de 3 permitidas · ${c.aulas} aulas no curso</p>`+
    (c.faltas>3?`<div class="warn bad">Reprovado por faltas</div>`:c.faltas==3?`<div class="warn">Atenção: limite de 3 faltas atingido. Mais uma falta reprova o aluno.</div>`:'')+`</div>`).join('')+
  `<div class="card"><h3>Evolução mensal (média das notas)</h3>${grafico(b.mensal||{})}</div><div class="card"><h3>Avaliações (1 a 5)</h3><div class="tbl"><table><tr><th>Item</th><th>Média geral</th>${ms.map(m=>`<th>${mesNome(m)}</th>`).join('')}</tr>`+
  b.itens.map(i=>`<tr><td>${i.item}</td><td><b>${i.media??'-'}</b></td>${ms.map(m=>`<td>${i.meses[m]??'-'}</td>`).join('')}</tr>`).join('')+`</table></div></div>`}

function abas(){const u=S.d.user.nivel,x=[];
  if(podeNotas()||podePres())x.push(['lancar',podeNotas()&&podePres()?'Lançar notas e presença':podeNotas()?'Lançar notas':'Lançar presença']);
  if(u=='admin'||u=='cadastro')x.push(['cadastro','Novo aluno'],['alunos','Alunos']);
  if(u=='admin')x.push(['usuarios','Usuários'],['cursos','Cursos'],['site','Site']);return x}
function painel(){const d=S.d;return `${logo()}<div class="card"><b>${esc(d.user.nome)}</b> (${esc(NIVEIS[d.user.nivel]||d.user.nivel)}) ${back()}<div class="tabs" style="margin-top:12px">${abas().map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('painel','${t[0]}')">${t[1]}</button>`).join('')}</div></div><div class="card">${tabs[S.tab]()}</div>`}
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
//GRAF
const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesNome=k=>MES[+k.slice(5,7)-1]+'/'+k.slice(0,4);
function mesesCurso(m){const ks=Object.keys(m).sort(),ini=ks[0]||hoje().slice(0,7),fim=ks[ks.length-1]||ini;let [y,mo]=ini.split('-').map(Number);const r=[];while(r.length<6||r[r.length-1]<fim){r.push(y+'-'+String(mo).padStart(2,'0'));if(++mo>12){mo=1;y++}}return r}
function grafico(m){const ms=mesesCurso(m),W=600,H=300,L=36,R=10,T=24,B=40,pw=W-L-R,ph=H-T-B,sl=pw/ms.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Média das notas por mês">`;
  for(let g=0;g<=5;g++){const y=T+ph-ph*g/5;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e3eaf0"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5b6b7a">${g}</text>`}
  ms.forEach((k,i)=>{const v=m[k],x=L+sl*i+sl*.2,w=sl*.6,cx=x+w/2;
    if(v!=null){const h=ph*v/5;s+=`<rect x="${x}" y="${T+ph-h}" width="${w}" height="${h}" rx="4" fill="#0d6fb8"/><text x="${cx}" y="${T+ph-h-6}" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2a37">${String(v).replace('.',',')}</text>`}
    else s+=`<text x="${cx}" y="${T+ph-6}" text-anchor="middle" font-size="12" fill="#9aa9b7">-</text>`;
    s+=`<text x="${cx}" y="${H-14}" text-anchor="middle" font-size="12" fill="#5b6b7a">${mesNome(k)}</text>`});
  return s+'</svg>'}
//FIMGRAF
const turmasLista=()=>[...new Set([...(S.d.turmas||[]),...S.novas])].sort((a,b)=>a.localeCompare(b,'pt'));
//LANC
const TIPOS={MAGES:'Municipal (MAGES)',PRIV:'Privado (PRIV)'};
const NIVEIS={admin:'Administrador',notas:'Lança notas',presenca:'Lança presenças',lancamento:'Notas e presenças',cadastro:'Novo cadastro'};
const podeNotas=()=>['admin','notas','lancamento'].includes(S.d.user.nivel),podePres=()=>['admin','presenca','lancamento'].includes(S.d.user.nivel);
const dmy=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'não informada';
const dh=s=>{const [d,t]=String(s).split(' ');return dmy(d)+' '+(t||'').slice(0,5)};
const nomeCurso=s=>(S.d.cursos.find(c=>c.sigla===s)||{nome:s}).nome;
const minhasTurmas=()=>[...new Set(S.d.alunos.flatMap(a=>String(a.turma).split(',').map(x=>x.trim())).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
const ficha=a=>`<div class="ficha"><p><b>Aluno:</b> ${esc(a.nome)}</p><p><b>Data de nascimento:</b> ${dmy(a.nasc)}${a.idade?' ('+a.idade+' anos)':''}</p><p><b>Turma(s):</b> ${esc(a.turma)}</p><p><b>Tipo:</b> ${esc(TIPOS[a.tipo]||'Não informado')}</p><p><b>Cursos:</b> ${a.cursos.split(',').map(c=>esc(nomeCurso(c))).join(', ')}</p><p><b>Dias:</b> ${esc(a.dia)}</p></div>`;
function listaAl(){const L=S.l,q=norm(L.q||''),l=S.d.alunos.filter(a=>(!L.turma||a.turma.split(',').map(x=>x.trim()).includes(L.turma))&&norm(a.nome).includes(q));
  return l.length?l.map(a=>`<button class="row" onclick="lSel('${a.id}')">${esc(a.nome)}<small>Turma ${esc(a.turma)} · ${esc(a.cursos)}${a.tipo?' · '+esc(a.tipo):''}</small></button>`).join(''):'<p>Nenhum aluno encontrado.</p>'}
function lSel(id){if(!S.l.data)return msg('Escolha a data da aula');S.l.id=id;S.l.fase='confirma';render()}
function lancar(){S.l=S.l||{fase:'lista',data:hoje(),turma:'',q:''};const L=S.l,a=S.d.alunos.find(x=>x.id===L.id);
  if(!S.d.alunos.length)return '<p>Nenhum aluno cadastrado nas suas turmas ainda.</p>';
  if(L.fase=='lista')return `<h3>Escolher aluno</h3><label>Turma</label><select onchange="S.l.turma=this.value;$('#lista').innerHTML=listaAl()"><option value="">Todas as minhas turmas</option>${minhasTurmas().map(t=>`<option ${t===L.turma?'selected':''}>${esc(t)}</option>`).join('')}</select><label>Data da aula</label><input type="date" value="${L.data}" onchange="S.l.data=this.value"><label>Buscar aluno</label><input value="${esc(L.q)}" placeholder="Digite parte do nome" autocomplete="off" oninput="S.l.q=this.value;$('#lista').innerHTML=listaAl()"><div id="lista">${listaAl()}</div>`;
  if(L.fase=='confirma')return `<h3>Confirme os dados do aluno</h3>${ficha(a)}<p><b>Data da aula:</b> ${dmy(L.data)}</p><button class="big" onclick="S.l.fase='form';render()">Confirmar e lançar</button><button class="big g" onclick="S.l.fase='lista';render()">Voltar</button>`;
  if(L.fase=='form')return `<h3>${esc(a.nome)}</h3><p>Turma ${esc(a.turma)} · aula de ${dmy(L.data)}</p>`+
    (podePres()?`<h4>Presença</h4><label>Curso</label><select id="cu">${a.cursos.split(',').map(c=>`<option value="${esc(c)}">${esc(nomeCurso(c))}</option>`).join('')}</select><label>Situação</label><select id="st"><option value="P">Presente</option><option value="F">Falta</option></select>`:'')+
    (podeNotas()?`<h4>Notas (1 a 5, números inteiros)</h4><div class="grid">${ITENS.map((i,k)=>`<div><label>${i}</label><input id="i${k}" type="number" min="1" max="5" step="1" inputmode="numeric"></div>`).join('')}</div>`:'')+
    `<button class="big" onclick="lFinaliza()">Finalizar lançamento</button><button class="big g" onclick="S.l.fase='confirma';render()">Voltar</button>`;
  const R=L.res,md=R.notas.length?(R.notas.reduce((t,n)=>t+n.nota,0)/R.notas.length).toFixed(1).replace('.',','):'';
  return `<h3>Lançamento concluído</h3><div class="ficha"><p><b>Aluno:</b> ${esc(a.nome)}</p><p><b>Turma:</b> ${esc(a.turma)} · <b>Aula:</b> ${dmy(L.data)}</p>`+
    (R.presenca?`<p><b>Presença:</b> ${esc(nomeCurso(R.presenca.curso))} — ${R.presenca.status=='P'?'Presente':'Falta'}</p><p><b>Faltas no curso:</b> ${R.faltas} (limite: 3)</p>`+(R.faltas>3?'<div class="warn bad">Aluno reprovado por faltas</div>':R.faltas==3?'<div class="warn">Atenção: limite de 3 faltas atingido</div>':''):'')+
    (R.notas.length?`<p><b>Notas:</b> ${R.notas.length} de 10 itens · média do dia <b>${md}</b></p><div class="tbl"><table>${R.notas.map(n=>`<tr><td>${esc(n.item)}</td><td>${n.nota}</td></tr>`).join('')}</table></div>`:'')+
    `<p><b>Lançado por:</b> ${esc(S.d.user.nome)} em ${dh(R.quando)}</p></div><button class="big" onclick="S.l={fase:'lista',data:S.l.data,turma:S.l.turma,q:''};render()">Lançar outro aluno</button>`}
async function lFinaliza(){const L=S.l,a=S.d.alunos.find(x=>x.id===L.id);
  const notas=podeNotas()?ITENS.map((item,k)=>({item,nota:$('#i'+k).value})).filter(n=>n.nota!=='').map(n=>({item:n.item,nota:+n.nota})):[];
  if(notas.some(n=>!Number.isInteger(n.nota)||n.nota<1||n.nota>5))return msg('Use notas inteiras de 1 a 5');
  const presenca=podePres()?{curso:V('#cu'),status:V('#st')}:null;
  if(!notas.length&&!presenca)return msg('Preencha ao menos uma nota');
  const r=await envia('lancar',{alunoId:a.id,data:L.data,notas,presenca});if(r.erro)return;
  L.res={...r,notas,presenca};L.fase='fim';render()}
//FIMLANC
//ALUNOS
const chkTurma=(t,on)=>`<label class="ck2"><input type="checkbox" class="tk" value="${esc(t)}" ${on?'checked':''}>${esc(t)}</label>`;
const camposAluno=a=>{const ts=(a.turma||'').split(',').map(x=>x.trim()),dias=(a.dia||'').split(',').map(x=>x.trim()),cs=(a.cursos||'').split(',');
  return `<label>Nome do aluno</label><input id="nm" value="${esc(a.nome)}"><label>Data de nascimento</label><input id="nc" type="date" value="${/^\d{4}-\d{2}-\d{2}$/.test(a.nasc||'')?a.nasc:''}"><label>Turmas</label><div id="tgrp" class="dias">${turmasLista().length?turmasLista().map(t=>chkTurma(t,ts.includes(t))).join(''):'<span class="vazio">Nenhuma turma cadastrada ainda.</span>'}</div><button type="button" class="s g" onclick="novaTurma()">+ Criar nova turma</button><label style="display:block;margin-top:12px">Tipo de aluno</label><select id="tp"><option value="">Selecione</option>${Object.keys(TIPOS).map(k=>`<option value="${k}" ${a.tipo===k?'selected':''}>${TIPOS[k]}</option>`).join('')}</select><label style="display:block;margin-top:4px">Dias da semana</label><div class="dias">${DIAS.map(d=>`<label class="ck2"><input type="checkbox" class="dk" value="${d}" ${dias.includes(d)?'checked':''}>${d}</label>`).join('')}</div><label>Cursos</label>${S.d.cursos.map(c=>`<div><input type="checkbox" class="ck" value="${esc(c.sigla)}" ${cs.includes(c.sigla)?'checked':''}>${esc(c.nome)}</div>`).join('')}`+(a.id?`<label style="display:block;margin-top:10px">Senha do aluno</label><input id="sn" value="${esc(a.senha)}">`:'')};
function listaAdm(){const q=norm(S.qa||''),l=S.d.alunosAdm.filter(a=>norm(a.nome).includes(q));
  return l.length?`<div class="tbl"><table>${l.map(a=>`<tr><td>${esc(a.nome)}<br><small>Turma ${esc(a.turma)} · ${esc(TIPOS[a.tipo]||'Tipo não informado')} · ${esc(a.cursos)}</small></td><td style="white-space:nowrap"><button class="s g" onclick="edAluno('${a.id}')">Editar</button> <button class="s o" onclick="delAluno('${a.id}')">Excluir</button></td></tr>`).join('')}</table></div>`:'<p>Nenhum aluno encontrado.</p>'}
function abaAlunos(){if(S.ea){const a=S.d.alunosAdm.find(x=>x.id===S.ea);return `<h3>Editar aluno</h3>${camposAluno(a)}<button onclick="salvaAluno()">Salvar alterações</button> <button class="g" onclick="S.ea=null;render()">Cancelar</button>`}
  return `<label>Buscar aluno</label><input value="${esc(S.qa||'')}" placeholder="Digite parte do nome" autocomplete="off" oninput="S.qa=this.value;$('#la').innerHTML=listaAdm()"><div id="la">${listaAdm()}</div>`}
const edAluno=id=>{S.ea=id;render()};
async function salvaAluno(){const turmas=[...document.querySelectorAll('.tk:checked')].map(c=>c.value),cursos=[...document.querySelectorAll('.ck:checked')].map(c=>c.value),dias=[...document.querySelectorAll('.dk:checked')].map(c=>c.value);
  if(!V('#nm')||!turmas.length||!V('#tp')||!dias.length||!cursos.length)return msg('Preencha o nome, ao menos uma turma, o tipo, os dias da semana e ao menos um curso');
  const r=await envia('editAluno',{id:S.ea,nome:V('#nm'),nasc:V('#nc'),turma:turmas.join(', '),tipo:V('#tp'),dia:dias.join(', '),cursos,senha:V('#sn')});if(!r.erro){S.ea=null;await recarrega()}}
async function delAluno(id){const a=S.d.alunosAdm.find(x=>x.id===id);if(confirm('Excluir o aluno '+a.nome+'? As notas e presenças já lançadas continuam guardadas na planilha.')){const r=await envia('delAluno',{id});if(!r.erro)await recarrega()}}
//FIMALUNOS
//USU
const CARGOS=['Professor','Secretaria','Auxiliar','Administrador'];
const NV_OPC={lancamento:'Lança notas e presenças',notas:'Lança só notas',presenca:'Lança só presenças',cadastro:'Novo cadastro (cadastra alunos)',admin:'Administrador'};
const nivOpc=(ks,v)=>ks.map(k=>`<option value="${k}" ${k===v?'selected':''}>${NV_OPC[k]}</option>`).join('');
const chkU=(t,on)=>`<label class="ck2"><input type="checkbox" class="ut" value="${esc(t)}" ${on?'checked':''}>${esc(t)}</label>`;
const usuTurmas=sel=>{const l=[...new Set([...turmasLista(),...sel])];return l.length?l.map(t=>chkU(t,sel.includes(t))).join(''):'<span>Nenhuma turma cadastrada ainda. Cadastre alunos com turma primeiro.</span>'};
const professores=()=>[...new Set(S.d.usuarios.filter(u=>norm(u.cargo)==='professor').map(u=>u.nome))];
function usuCargo(sel){const c=V('#uc'),v=sel||V('#uv'),pa=c=='Professor'||c=='Auxiliar';
  $('#uv').innerHTML=nivOpc(c=='Administrador'?['admin']:['lancamento','notas','presenca','cadastro'],v);
  $('#utg').style.display=pa?'block':'none';const t=$('#uth');t.style.display=c&&!pa?'block':'none';t.textContent='Secretaria e administrador atuam em todas as turmas.'}
function edUsu(i){const u=S.d.usuarios[i],c=CARGOS.find(x=>norm(x)===norm(u.cargo))||(u.nivel=='admin'?'Administrador':'');
  set('ul',u.login);set('un',u.nome);set('uc',c);usuCargo(u.nivel);$('#utgrid').innerHTML=usuTurmas(u.turmas.split(',').map(x=>x.trim()).filter(x=>x&&x!=='*'))}
async function salvaUsu(){const cargo=V('#uc'),pa=cargo=='Professor'||cargo=='Auxiliar',ts=[...document.querySelectorAll('.ut:checked')].map(c=>c.value);
  if(!V('#ul')||!V('#un'))return msg('Preencha o login e o nome');if(!cargo)return msg('Selecione o cargo');if(pa&&!ts.length)return msg('Marque ao menos uma turma');
  const r=await envia('usuario',{login:V('#ul'),nome:V('#un'),novaSenha:V('#up'),cargo,nivel:V('#uv'),turmas:pa?ts.join(', '):'*'});if(!r.erro)recarrega()}
//FIMUSU
function modal(h){let m=$('#modal');if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m)}m.innerHTML=`<div class="mbox">${h}</div>`;m.style.display='flex'}
const fechaModal=()=>{$('#modal').style.display='none'};
function novaTurma(){modal(`<h3>Criar nova turma</h3><p>Você tem certeza que deseja criar uma nova turma? Ela já não existe na lista?</p><p><b>Turmas existentes:</b> ${esc(turmasLista().join(', ')||'nenhuma')}</p><label>Nome da nova turma</label><input id="nt" autocomplete="off"><button class="big" onclick="salvaTurma()">Cadastrar</button><button class="big g" onclick="fechaModal()">Voltar</button>`);setTimeout(()=>$('#nt').focus(),50)}
function salvaTurma(){const n=V('#nt').trim();if(!n)return msg('Digite o nome da turma');if(n.includes(','))return msg('O nome da turma não pode ter vírgula');
  const ex=turmasLista().find(t=>norm(t)===norm(n)),g=$('#tgrp');
  if(ex){const c=[...g.querySelectorAll('.tk')].find(x=>x.value===ex);if(c)c.checked=true;fechaModal();return msg('Essa turma já existe na lista e foi marcada')}
  S.novas.push(n);const v=g.querySelector('.vazio');if(v)v.remove();g.insertAdjacentHTML('beforeend',chkTurma(n,true));fechaModal();msg('Turma criada e marcada. Ela fica salva ao cadastrar o aluno.')}

const tabs={
lancar:()=>lancar(),
alunos:()=>abaAlunos(),
cadastro:()=>camposAluno({})+'<button onclick="cadAluno()">Cadastrar e gerar senha</button>',
usuarios:()=>`<h3>Colaboradores e professores</h3><div class="tbl"><table>${S.d.usuarios.map((u,i)=>`<tr><td>${esc(u.nome)}<br><small>${esc(u.login)} · ${esc(u.cargo||'cargo não definido')} · ${esc(NIVEIS[u.nivel]||u.nivel)} · ${u.turmas=='*'?'todas as turmas':esc(u.turmas)}</small></td><td style="white-space:nowrap"><button class="s g" onclick="edUsu(${i})">Editar</button> <button class="s o" onclick="delUsu(${i})">Excluir</button></td></tr>`).join('')}</table></div><h3>Cadastrar / editar</h3><label>Login</label><input id="ul" autocapitalize="none"><label>Nome</label><input id="un"><label>Senha (deixe vazio para manter)</label><input id="up" type="password"><label>Cargo</label><select id="uc" onchange="usuCargo()"><option value="">Selecione</option>${CARGOS.map(c=>`<option>${c}</option>`).join('')}</select><label>Nível de acesso</label><select id="uv">${nivOpc(['lancamento','notas','presenca','cadastro'],'')}</select><div id="utg" style="display:none"><label>Turmas em que atua</label><div class="dias" id="utgrid">${usuTurmas([])}</div></div><p id="uth" style="display:none"></p><button onclick="salvaUsu()">Salvar</button>`,
cursos:()=>`<div class="tbl"><table>${S.d.cursos.map((c,i)=>`<tr><td>${esc(c.sigla)} · ${esc(c.nome)}<br><small>Professor: ${esc(c.professor||'não definido')}</small></td><td style="white-space:nowrap"><button class="s g" onclick="edCur(${i})">Editar</button> <button class="s o" onclick="delCur(${i})">Excluir</button></td></tr>`).join('')}</table></div><h3>Novo / editar curso</h3><label>Sigla</label><input id="cs"><label>Nome</label><input id="cn"><label>Professor</label><select id="cp"><option value="">— Sem professor —</option>${professores().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select>${professores().length?'':'<p><small>Nenhum professor cadastrado. Cadastre um usuário com o cargo Professor na aba Usuários.</small></p>'}<button onclick="salvaCur()">Salvar</button>`,
site:()=>`<label>Aviso na página inicial</label><input id="sa" value="${esc(S.cfg.aviso||'')}"><label>Imagem da logo (link direto da imagem, terminando em .jpg ou .png)</label><input id="sl" value="${esc(S.cfg.logo||'')}"><button onclick="salvaSite()">Salvar</button>`};

async function cadAluno(){const turmas=[...document.querySelectorAll('.tk:checked')].map(c=>c.value),cursos=[...document.querySelectorAll('.ck:checked')].map(c=>c.value),dias=[...document.querySelectorAll('.dk:checked')].map(c=>c.value);if(!V('#nm')||!turmas.length||!V('#tp')||!dias.length||!cursos.length)return msg('Preencha o nome, ao menos uma turma, o tipo (MAGES ou PRIV), os dias da semana e ao menos um curso');
  const r=await envia('aluno',{nome:V('#nm'),nasc:V('#nc'),turma:turmas.join(', '),dia:dias.join(', '),tipo:V('#tp'),cursos});if(!r.erro){alert(r.ok);await recarrega()}}
async function recarrega(){const r=await api('init');if(!r.erro){S.d=r;render()}}
const set=(id,v)=>$('#'+id).value=v;
async function delUsu(i){if(confirm('Excluir este usuário?')){const r=await envia('delUsuario',{login:S.d.usuarios[i].login});if(!r.erro)recarrega()}}
function edCur(i){const c=S.d.cursos[i];set('cs',c.sigla);set('cn',c.nome);const sel=$('#cp');
  if(c.professor&&![...sel.options].some(o=>o.value===c.professor))sel.insertAdjacentHTML('beforeend',`<option value="${esc(c.professor)}">${esc(c.professor)} (não cadastrado como professor)</option>`);sel.value=c.professor||''}
async function salvaCur(){const r=await envia('curso',{sigla:V('#cs'),nome:V('#cn'),professor:V('#cp')});if(!r.erro)recarrega()}
async function delCur(i){if(confirm('Excluir este curso?')){const r=await envia('delCurso',{sigla:S.d.cursos[i].sigla});if(!r.erro)recarrega()}}
async function salvaSite(){const cfg={aviso:V('#sa'),logo:V('#sl')};const r=await envia('setConfig',{cfg});if(!r.erro){S.cfg={...S.cfg,...cfg};render()}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&(S.v==='resp'||S.v==='colab'))entrar(S.v)});
(async()=>{render();const c=await api('config');if(!c.erro){S.cfg=c;render()}})();
</script></body></html>
